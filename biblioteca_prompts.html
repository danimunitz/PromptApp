<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca de Prompts</title>
  <style>
    :root {
      --font-family: "Inter", system-ui, -apple-system, sans-serif;
      --radius: 12px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      --transition: 0.2s ease;
      --spotlight: rgba(0, 0, 0, 0.35);
      --max-width: 1400px;
    }

    body {
      margin: 0;
      font-family: var(--font-family);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .theme {
      --bg: #f5f5f7;
      --card: #ffffff;
      --border: #e6e6eb;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-contrast: #ffffff;
      --accent: #10b981;
      --surface: #f8fafc;
      --shadow-color: rgba(0, 0, 0, 0.08);
    }

    .theme-1 { --bg: #f5f5f7; --card: #ffffff; --border: #e5e7eb; --muted: #6b7280; --primary: #2563eb; --primary-contrast: #fff; --accent: #16a34a; --surface: #eef2ff; --shadow-color: rgba(37,99,235,0.12);}    
    .theme-2 { --bg: #fdfaf6; --card: #ffffff; --border: #f1eadc; --muted: #7c6f64; --primary: #d97706; --primary-contrast: #fff; --accent: #3b82f6; --surface: #fff7ed; --shadow-color: rgba(217,119,6,0.15);}    
    .theme-3 { --bg: #f0fdfa; --card: #ffffff; --border: #c7f9e9; --muted: #0f172a; --primary: #059669; --primary-contrast: #fff; --accent: #2563eb; --surface: #e0f2fe; --shadow-color: rgba(5,150,105,0.18);}    
    .theme-4 { --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --muted: #475569; --primary: #7c3aed; --primary-contrast: #fff; --accent: #f59e0b; --surface: #eef2ff; --shadow-color: rgba(124,58,237,0.16);}    
    .theme-5 { --bg: #fdf2f8; --card: #ffffff; --border: #fbcfe8; --muted: #831843; --primary: #db2777; --primary-contrast: #fff; --accent: #2563eb; --surface: #fff1f2; --shadow-color: rgba(219,39,119,0.15);}    
    .theme-6 { --bg: #0b1224; --card: #131a2d; --border: #1f2937; --muted: #9ca3af; --primary: #60a5fa; --primary-contrast: #0b1224; --accent: #fbbf24; --surface: #111827; --shadow-color: rgba(0,0,0,0.5);}    
    .theme-7 { --bg: #0f0f10; --card: #16171a; --border: #2a2b31; --muted: #a1a1aa; --primary: #22d3ee; --primary-contrast: #0f0f10; --accent: #a78bfa; --surface: #111216; --shadow-color: rgba(0,0,0,0.55);}    
    .theme-8 { --bg: #101418; --card: #181e24; --border: #24303a; --muted: #cbd5e1; --primary: #38bdf8; --primary-contrast: #0b1224; --accent: #22c55e; --surface: #0f172a; --shadow-color: rgba(0,0,0,0.45);}    
    .theme-9 { --bg: #1c1917; --card: #262220; --border: #3f3a37; --muted: #e7e5e4; --primary: #f97316; --primary-contrast: #1c1917; --accent: #a3e635; --surface: #1f2937; --shadow-color: rgba(0,0,0,0.48);}    
    .theme-10 { --bg: #0d1117; --card: #111827; --border: #1f2937; --muted: #e5e7eb; --primary: #8b5cf6; --primary-contrast: #0d1117; --accent: #06b6d4; --surface: #0b1224; --shadow-color: rgba(0,0,0,0.5);}    

    * { box-sizing: border-box; }

    h1, h2, h3, h4 { margin: 0; color: var(--text); }

    button, input, textarea, select { font: inherit; }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg);
      color: var(--text);
      transition: background var(--transition), color var(--transition);
    }

    .app-shell {
      width: min(100%, var(--max-width));
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .app-header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: auto auto;
      gap: 8px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .controls, .right-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 999px;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .btn {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      padding: 8px 12px;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn.primary { background: var(--primary); color: var(--primary-contrast); border-color: transparent; }
    .btn.ghost { background: transparent; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px var(--shadow-color); }

    .layout {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 14px;
      height: calc(100vh - 180px);
      min-height: 520px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .left, .right { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .right { overflow: hidden; }

    form { display: flex; flex-direction: column; gap: 10px; }

    label { font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }

    input[type="text"], input[type="date"], input[type="number"], textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      transition: border var(--transition), box-shadow var(--transition);
    }

    textarea { min-height: 120px; resize: vertical; }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent);
    }

    .tags-input { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-weight: 600;
      color: var(--text);
    }
    .tag-chip .bullet { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--border); }
    .tag-chip .remove { cursor: pointer; opacity: 0.6; }

    .tag-panel header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .tag-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow: auto; }
    .tag-row { display: grid; grid-template-columns: 1fr 80px 70px; gap: 8px; align-items: center; background: var(--surface); padding: 8px; border-radius: 10px; border: 1px solid var(--border); }
    .tag-row input[type="text"] { padding: 8px; }
    .tag-row input[type="color"] { width: 100%; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); }

    .library-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .library-list { overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }

    .prompt-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      background: var(--surface);
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
      align-items: start;
      transition: border var(--transition), box-shadow var(--transition);
    }
    .prompt-card.drag-over { border-style: dashed; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent); }

    .prompt-meta { display: flex; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 0.9rem; }
    .prompt-actions { display: flex; flex-direction: column; gap: 6px; }
    .favorite { color: gold; }

    .fab {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: var(--primary-contrast);
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      cursor: pointer;
      z-index: 12;
    }

    .modal {
      position: static;
      display: block;
    }

    .modal .modal-content {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      max-height: 90vh;
      overflow: auto;
      width: 100%;
    }

    #help-modal .modal-content { max-width: 720px; }

    .hidden { display: none !important; }

    .toast-area { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 30; }
    .toast { background: var(--card); border: 1px solid var(--border); padding: 12px 14px; border-radius: 10px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px; }

    .tour-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 50; display: none; align-items: center; justify-content: center; }
    .tour-overlay.active { display: flex; }
    .tour-spotlight { position: absolute; border-radius: 12px; box-shadow: 0 0 0 9999px var(--spotlight); pointer-events: none; transition: all 0.2s ease; }
    .tour-tooltip { position: absolute; background: var(--card); color: var(--text); padding: 12px 14px; border-radius: 12px; box-shadow: var(--shadow); max-width: 280px; border: 1px solid var(--border); }
    .tour-controls { margin-top: 10px; display: flex; gap: 8px; }

    .pill { background: var(--surface); padding: 4px 8px; border-radius: 999px; border: 1px solid var(--border); }

    @media (max-width: 900px) {
      .app-header { grid-template-columns: 1fr 1fr; }
      .header-row { flex-wrap: wrap; }
      .layout { grid-template-columns: 1fr; height: auto; }
      .left { order: 1; }
      .right { order: 2; min-height: 420px; }
      .prompt-card { grid-template-columns: 1fr; }
      .fab { display: inline-flex; }
      #form-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; padding: 16px; z-index: 15; }
      #form-modal.active { display: flex; }
      #form-modal .modal-content { max-width: 520px; width: 100%; }
      .tag-list { display: none; }
      .tag-list.expanded { display: flex; }
    }
  </style>
</head>
<body class="theme theme-1">
  <div id="app" data-lang="es">
    <div class="app-shell">
      <header class="app-header" id="appHeader">
        <div class="header-row">
          <div class="title" data-i18n="title">Biblioteca de Prompts</div>
          <div class="controls">
            <select id="langSelect" class="btn">
              <option value="es">ES</option>
              <option value="ca">CA</option>
              <option value="en">EN</option>
            </select>
            <select id="themeSelect" class="btn"></select>
            <button class="btn ghost" id="tourBtn" data-i18n="tour">Tour</button>
            <button class="btn ghost" id="helpBtn" data-i18n="help">Ayuda</button>
          </div>
        </div>
        <div class="header-row">
          <div class="badge" id="statusBadge"></div>
          <div class="controls right-controls">
            <button class="btn" id="exportBtn" data-i18n="export">Exportar XML</button>
            <label class="btn" for="importInput" id="importLabel"><span data-i18n="import">Importar XML</span><input id="importInput" type="file" accept=".xml" hidden /></label>
          </div>
        </div>
      </header>

      <main class="layout">
        <section class="left" id="leftPanel">
          <div id="form-modal" class="modal inline-mode">
            <div class="modal-content card" id="formCard">
              <div class="library-header">
                <h2 data-i18n="formTitle">Crear / Editar Prompt</h2>
                <div class="pill" id="formMode">Nuevo</div>
              </div>
              <form id="promptForm">
                <label><span data-i18n="titleLabel">Título</span><input type="text" id="title" required maxlength="120" /></label>
                <label><span data-i18n="textLabel">Texto</span><textarea id="text" required></textarea></label>
                <label><span data-i18n="tagsLabel">Etiquetas (coma)</span><input type="text" id="tagsInput" placeholder="Excel, Marketing" /></label>
                <div class="tags-input" id="selectedTags"></div>
                <label><span data-i18n="notesLabel">Notas</span><textarea id="notes" rows="3"></textarea></label>
                <label><span data-i18n="dateLabel">Fecha</span><input type="date" id="date" /></label>
                <label><span data-i18n="copiesLabel">Copias</span><input type="number" id="copies" min="0" value="0" /></label>
                <label style="align-items:center; gap:10px;"><input type="checkbox" id="favorite" /> <span data-i18n="favorite">Favorito</span></label>
                <div class="controls" style="justify-content: flex-end;">
                  <button type="button" class="btn" id="resetBtn" data-i18n="reset">Limpiar</button>
                  <button type="submit" class="btn primary" id="saveBtn" data-i18n="save">Guardar</button>
                </div>
              </form>
            </div>
          </div>

          <section class="card tag-panel" id="tagPanel">
            <header>
              <h3 data-i18n="tagManager">Etiquetas</h3>
              <button class="btn ghost" id="toggleTags" data-i18n="toggleTags">Mostrar/Ocultar</button>
            </header>
            <div class="tag-list" id="tagList"></div>
          </section>
        </section>

        <section class="right card" id="libraryPanel">
          <div class="library-header">
            <h2 data-i18n="library">Biblioteca</h2>
            <input type="text" id="search" placeholder="Buscar" />
          </div>
          <div class="library-list" id="promptList"></div>
        </section>
      </main>
    </div>
  </div>

  <button class="fab" id="fab">＋</button>

  <div class="modal hidden" id="help-modal">
    <div class="modal-content">
      <h2 data-i18n="docsTitle">Documentación</h2>
      <p data-i18n="docsBody">Administra, etiqueta y respalda tus prompts. Usa el tour para un recorrido guiado.</p>
      <ul>
        <li data-i18n="docsOffline">Funciona sin conexión (file://)</li>
        <li data-i18n="docsDrag">Arrastra para reordenar la biblioteca</li>
        <li data-i18n="docsBackup">Exporta/Importa en XML</li>
      </ul>
      <div class="controls" style="justify-content:flex-end;">
        <button class="btn primary" id="closeHelp" data-i18n="close">Cerrar</button>
      </div>
    </div>
  </div>

  <div class="toast-area" id="toastArea"></div>

  <div class="tour-overlay" id="tourOverlay">
    <div class="tour-spotlight" id="tourSpotlight"></div>
    <div class="tour-tooltip" id="tourTooltip">
      <div id="tourText"></div>
      <div class="tour-controls">
        <button class="btn" id="tourPrev">◀</button>
        <button class="btn primary" id="tourNext">▶</button>
        <button class="btn ghost" id="tourEnd" data-i18n="close">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    const qs = (sel) => document.querySelector(sel);
    const qsa = (sel) => Array.from(document.querySelectorAll(sel));

    const palette = ['#2563eb', '#db2777', '#16a34a', '#f59e0b', '#7c3aed', '#14b8a6', '#8b5cf6', '#0ea5e9', '#ef4444', '#c084fc'];

    const translations = {
      es: {
        title: 'Biblioteca de Prompts', tour: 'Tour', help: 'Ayuda', export: 'Exportar XML', import: 'Importar XML',
        formTitle: 'Crear / Editar Prompt', titleLabel: 'Título', textLabel: 'Texto', tagsLabel: 'Etiquetas (coma)', notesLabel: 'Notas', dateLabel: 'Fecha', copiesLabel: 'Copias', favorite: 'Favorito', reset: 'Limpiar', save: 'Guardar', tagManager: 'Etiquetas', toggleTags: 'Mostrar/Ocultar', library: 'Biblioteca', docsTitle: 'Documentación', docsBody: 'Administra, etiqueta y respalda tus prompts. Usa el tour para un recorrido guiado.', docsOffline: 'Funciona sin conexión (file://)', docsDrag: 'Arrastra para reordenar la biblioteca', docsBackup: 'Exporta/Importa en XML', close: 'Cerrar', status: (count) => `${count} prompts`, copy: 'Copiar', edit: 'Editar', remove: 'Eliminar', undo: 'Deshacer', deleted: 'Prompt eliminado', tourSteps: ['Cambia idioma y tema.', 'Exporta/Importa tu base XML.', 'Crea prompts y gestiona etiquetas inteligentes.', 'Reordena arrastrando en la biblioteca.', 'Usa la ayuda cuando lo necesites.'], searchPlaceholder: 'Buscar', newMode: 'Nuevo', editMode: 'Editando', fav: 'Favorito'
      },
      ca: {
        title: 'Biblioteca de Prompts', tour: 'Visita', help: 'Ajuda', export: 'Exporta XML', import: 'Importa XML',
        formTitle: 'Crear / Editar Prompt', titleLabel: 'Títol', textLabel: 'Text', tagsLabel: 'Etiquetes (coma)', notesLabel: 'Notes', dateLabel: 'Data', copiesLabel: 'Còpies', favorite: 'Preferit', reset: 'Neteja', save: 'Desa', tagManager: 'Etiquetes', toggleTags: 'Mostrar/Ocultar', library: 'Biblioteca', docsTitle: 'Documentació', docsBody: 'Administra, etiqueta i fes còpies dels teus prompts. Usa la visita guiada.', docsOffline: 'Funciona sense connexió (file://)', docsDrag: 'Arrossega per reordenar', docsBackup: 'Exporta/Importa en XML', close: 'Tanca', status: (count) => `${count} prompts`, copy: 'Copia', edit: 'Edita', remove: 'Elimina', undo: 'Desfés', deleted: 'Prompt eliminat', tourSteps: ['Canvia idioma i tema.', 'Exporta/Importa la base XML.', 'Crea prompts i gestiona etiquetes intel·ligents.', 'Reordena arrossegant a la biblioteca.', 'Fes servir l\'ajuda quan calgui.'], searchPlaceholder: 'Cerca', newMode: 'Nou', editMode: 'Editant', fav: 'Preferit'
      },
      en: {
        title: 'Prompt Library', tour: 'Tour', help: 'Help', export: 'Export XML', import: 'Import XML',
        formTitle: 'Create / Edit Prompt', titleLabel: 'Title', textLabel: 'Text', tagsLabel: 'Tags (comma)', notesLabel: 'Notes', dateLabel: 'Date', copiesLabel: 'Copies', favorite: 'Favorite', reset: 'Clear', save: 'Save', tagManager: 'Tags', toggleTags: 'Show/Hide', library: 'Library', docsTitle: 'Docs', docsBody: 'Manage, tag, and backup your prompts. Use the guided tour.', docsOffline: 'Works offline (file://)', docsDrag: 'Drag to reorder the library', docsBackup: 'Export/Import XML', close: 'Close', status: (count) => `${count} prompts`, copy: 'Copy', edit: 'Edit', remove: 'Delete', undo: 'Undo', deleted: 'Prompt deleted', tourSteps: ['Switch language and theme.', 'Export/Import your XML base.', 'Create prompts and manage smart tags.', 'Reorder by dragging in the library.', 'Use help whenever needed.'], searchPlaceholder: 'Search', newMode: 'New', editMode: 'Editing', fav: 'Favorite'
      }
    };

    const state = {
      prompts: [],
      tags: {},
      language: 'es',
      theme: 'theme-1',
      deleted: null
    };

    const storageKey = 'promptLibraryState_v4';

    function loadState() {
      const raw = localStorage.getItem(storageKey);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          Object.assign(state, parsed);
        } catch (e) {
          console.warn('No se pudo cargar estado', e);
        }
      }
      state.editing = null;
      applyTheme(state.theme);
      applyLanguage(state.language);
    }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify(state));
    }

    function uuid() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return 'xxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function canonicalizeTag(name) {
      const clean = name.trim();
      if (!clean) return null;
      const key = clean.toLowerCase();
      if (state.tags[key]) return state.tags[key].name;
      const color = palette[Object.keys(state.tags).length % palette.length];
      state.tags[key] = { name: clean, color };
      return clean;
    }

    function renderTags() {
      const container = qs('#tagList');
      container.innerHTML = '';
      Object.values(state.tags).sort((a,b)=>a.name.localeCompare(b.name)).forEach(tag => {
        const row = document.createElement('div');
        row.className = 'tag-row';
        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.value = tag.name;
        nameInput.addEventListener('change', () => renameTag(tag.name, nameInput.value));
        const colorInput = document.createElement('input');
        colorInput.type = 'color';
        colorInput.value = tag.color;
        colorInput.addEventListener('input', () => { tag.color = colorInput.value; saveState(); renderPrompts(); });
        const badge = document.createElement('div');
        badge.className = 'pill';
        badge.style.borderColor = tag.color;
        badge.textContent = tag.name;
        row.append(nameInput, colorInput, badge);
        container.appendChild(row);
      });
    }

    function renameTag(oldName, newName) {
      const clean = newName.trim();
      if (!clean) return;
      const oldKey = oldName.toLowerCase();
      const newKey = clean.toLowerCase();
      const existing = state.tags[oldKey];
      if (!existing) return;
      if (oldKey === newKey) {
        existing.name = clean;
      } else {
        if (state.tags[newKey]) {
          // merge by updating prompts to new canonical name
          state.prompts.forEach(p => { p.tags = p.tags.map(t => t.toLowerCase() === oldKey ? state.tags[newKey].name : t); });
          delete state.tags[oldKey];
        } else {
          state.tags[newKey] = { name: clean, color: existing.color };
          delete state.tags[oldKey];
        }
        state.prompts.forEach(p => { p.tags = p.tags.map(t => t.toLowerCase() === oldKey ? clean : t); });
      }
      saveState();
      renderTags();
      renderPrompts();
    }

    function parseTagsInput(value) {
      return value.split(',').map(t => canonicalizeTag(t)).filter(Boolean);
    }

    function setSelectedTags(tags) {
      const wrap = qs('#selectedTags');
      wrap.innerHTML = '';
      tags.forEach(tagName => {
        const key = tagName.toLowerCase();
        const color = state.tags[key]?.color || palette[0];
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        const bullet = document.createElement('span');
        bullet.className = 'bullet';
        bullet.style.background = color;
        const text = document.createElement('span');
        text.textContent = state.tags[key]?.name || tagName;
        const remove = document.createElement('span');
        remove.className = 'remove';
        remove.textContent = '✕';
        remove.addEventListener('click', () => {
          const newTags = tags.filter(t => t !== tagName);
          setSelectedTags(newTags);
          qs('#tagsInput').value = newTags.join(', ');
        });
        chip.append(bullet, text, remove);
        wrap.appendChild(chip);
      });
    }

    function applyTheme(theme) {
      document.body.className = `theme ${theme}`;
      state.theme = theme;
      qs('#themeSelect').value = theme;
      saveState();
    }

    function applyLanguage(lang) {
      state.language = lang;
      const dict = translations[lang];
      document.documentElement.lang = lang;
      qsa('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (typeof dict[key] === 'string') el.textContent = dict[key];
      });
      qs('#search').placeholder = dict.searchPlaceholder;
      updateStatus();
      saveState();
    }

    function updateStatus() {
      const dict = translations[state.language];
      qs('#statusBadge').textContent = dict.status(state.prompts.length);
      qs('#formMode').textContent = state.editing ? dict.editMode : dict.newMode;
    }

    function renderPrompts(filter = '') {
      const list = qs('#promptList');
      list.innerHTML = '';
      const term = filter.toLowerCase();
      state.prompts.forEach((prompt, idx) => {
        if (term && !(prompt.title.toLowerCase().includes(term) || prompt.text.toLowerCase().includes(term) || prompt.tags.some(t => t.toLowerCase().includes(term)))) return;
        const card = document.createElement('article');
        card.className = 'prompt-card';
        card.draggable = true;
        card.dataset.id = prompt.id;
        card.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', prompt.id); setTimeout(() => card.classList.add('dragging'), 0); });
        card.addEventListener('dragend', () => card.classList.remove('dragging'));
        card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('drag-over'); });
        card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
        card.addEventListener('drop', (e) => {
          e.preventDefault();
          card.classList.remove('drag-over');
          const fromId = e.dataTransfer.getData('text/plain');
          reorderPrompts(fromId, prompt.id);
        });

        const content = document.createElement('div');
        const title = document.createElement('h3');
        title.textContent = prompt.title;
        const text = document.createElement('p');
        text.textContent = prompt.text;
        const tags = document.createElement('div');
        tags.className = 'prompt-meta';
        prompt.tags.forEach(t => {
          const key = t.toLowerCase();
          const chip = document.createElement('span');
          chip.className = 'pill';
          chip.style.borderColor = state.tags[key]?.color || palette[0];
          chip.textContent = state.tags[key]?.name || t;
          tags.appendChild(chip);
        });
        const meta = document.createElement('div');
        meta.className = 'prompt-meta';
        meta.innerHTML = `<span>${translations[state.language].dateLabel}: ${prompt.date || '-'}</span><span>📄 ${prompt.copies}</span>${prompt.favorite ? `<span class="favorite">★ ${translations[state.language].fav}</span>` : ''}`;

        content.append(title, text, tags, meta);

        const actions = document.createElement('div');
        actions.className = 'prompt-actions';
        const copyBtn = document.createElement('button');
        copyBtn.className = 'btn';
        copyBtn.textContent = translations[state.language].copy;
        copyBtn.addEventListener('click', () => handleCopy(prompt));
        const editBtn = document.createElement('button');
        editBtn.className = 'btn';
        editBtn.textContent = translations[state.language].edit;
        editBtn.addEventListener('click', () => loadPrompt(prompt));
        const favBtn = document.createElement('button');
        favBtn.className = 'btn ghost';
        favBtn.innerHTML = prompt.favorite ? '★' : '☆';
        favBtn.addEventListener('click', () => { prompt.favorite = !prompt.favorite; saveState(); renderPrompts(filter); });
        const delBtn = document.createElement('button');
        delBtn.className = 'btn';
        delBtn.textContent = translations[state.language].remove;
        delBtn.addEventListener('click', () => deletePrompt(prompt.id));
        actions.append(copyBtn, editBtn, favBtn, delBtn);

        card.append(content, actions);
        list.appendChild(card);
      });
      updateStatus();
    }

    function reorderPrompts(fromId, toId) {
      if (fromId === toId) return;
      const fromIndex = state.prompts.findIndex(p => p.id === fromId);
      const toIndex = state.prompts.findIndex(p => p.id === toId);
      const [moved] = state.prompts.splice(fromIndex, 1);
      state.prompts.splice(toIndex, 0, moved);
      saveState();
      renderPrompts(qs('#search').value);
    }

    function handleCopy(prompt) {
      navigator.clipboard?.writeText(prompt.text).catch(()=>{});
      prompt.copies = (Number(prompt.copies) || 0) + 1;
      saveState();
      renderPrompts(qs('#search').value);
    }

    function loadPrompt(prompt) {
      state.editing = prompt.id;
      qs('#title').value = prompt.title;
      qs('#text').value = prompt.text;
      qs('#notes').value = prompt.notes || '';
      qs('#date').value = prompt.date || '';
      qs('#copies').value = prompt.copies || 0;
      qs('#favorite').checked = !!prompt.favorite;
      qs('#tagsInput').value = prompt.tags.join(', ');
      setSelectedTags(prompt.tags);
      updateStatus();
      if (window.matchMedia('(max-width: 900px)').matches) toggleFormModal(true);
    }

    function resetForm() {
      state.editing = null;
      qs('#promptForm').reset();
      qs('#tagsInput').value = '';
      setSelectedTags([]);
      updateStatus();
    }

    function deletePrompt(id) {
      const idx = state.prompts.findIndex(p => p.id === id);
      if (idx === -1) return;
      state.deleted = state.prompts[idx];
      state.prompts.splice(idx,1);
      saveState();
      renderPrompts(qs('#search').value);
      showToast(`${translations[state.language].deleted}`, () => {
        state.prompts.splice(idx,0,state.deleted);
        saveState();
        renderPrompts(qs('#search').value);
        state.deleted = null;
      });
    }

    function showToast(message, onUndo) {
      const area = qs('#toastArea');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      const undo = document.createElement('button');
      undo.className = 'btn ghost';
      undo.textContent = translations[state.language].undo;
      undo.addEventListener('click', () => { onUndo?.(); toast.remove(); });
      toast.appendChild(undo);
      area.appendChild(toast);
      setTimeout(() => toast.remove(), 4500);
    }

    function toggleFormModal(open) {
      const modal = qs('#form-modal');
      if (open) {
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function initThemes() {
      const select = qs('#themeSelect');
      for (let i = 1; i <= 10; i++) {
        const opt = document.createElement('option');
        opt.value = `theme-${i}`;
        opt.textContent = `Tema ${i}`;
        select.appendChild(opt);
      }
      select.addEventListener('change', (e) => applyTheme(e.target.value));
    }

    function exportXML() {
      const doc = document.implementation.createDocument('', '', null);
      const root = doc.createElement('biblioteca');
      root.setAttribute('version', '1.0');
      const promptsNode = doc.createElement('prompts');
      state.prompts.forEach(p => {
        const node = doc.createElement('prompt');
        node.setAttribute('id', p.id);
        ['title','text','notes','date','copies'].forEach(k => {
          const el = doc.createElement(k);
          el.textContent = p[k] || '';
          node.appendChild(el);
        });
        const tags = doc.createElement('tags');
        p.tags.forEach(t => {
          const tag = doc.createElement('tag');
          tag.textContent = t;
          tags.appendChild(tag);
        });
        node.appendChild(tags);
        node.setAttribute('favorite', p.favorite ? '1' : '0');
        promptsNode.appendChild(node);
      });
      const tagsNode = doc.createElement('tagCatalog');
      Object.values(state.tags).forEach(t => {
        const node = doc.createElement('tag');
        node.setAttribute('color', t.color);
        node.textContent = t.name;
        tagsNode.appendChild(node);
      });
      root.append(promptsNode, tagsNode);
      doc.appendChild(root);
      const serializer = new XMLSerializer();
      const xml = serializer.serializeToString(doc);
      const blob = new Blob([xml], { type: 'application/xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'prompts.xml';
      a.click();
    }

    function importXML(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parser = new DOMParser();
          const xml = parser.parseFromString(reader.result, 'text/xml');
          state.tags = {};
          Array.from(xml.querySelectorAll('tagCatalog tag')).forEach(tagNode => {
            const name = tagNode.textContent || '';
            const color = tagNode.getAttribute('color') || palette[0];
            if (!name.trim()) return;
            state.tags[name.toLowerCase()] = { name, color };
          });
          const promptNodes = Array.from(xml.querySelectorAll('prompt'));
          state.prompts = promptNodes.map(node => ({
            id: node.getAttribute('id') || uuid(),
            title: node.querySelector('title')?.textContent || '',
            text: node.querySelector('text')?.textContent || '',
            notes: node.querySelector('notes')?.textContent || '',
            date: node.querySelector('date')?.textContent || '',
            copies: Number(node.querySelector('copies')?.textContent || 0),
            favorite: node.getAttribute('favorite') === '1',
            tags: Array.from(node.querySelectorAll('tags tag')).map(t => canonicalizeTag(t.textContent || ''))
          }));
          saveState();
          renderTags();
          renderPrompts(qs('#search').value);
        } catch (err) {
          alert('XML inválido');
        }
      };
      reader.readAsText(file);
    }

    function startTour() {
      const steps = [
        { sel: '#appHeader', text: translations[state.language].tourSteps[0] },
        { sel: '#importLabel', text: translations[state.language].tourSteps[1] },
        { sel: '#formCard', text: translations[state.language].tourSteps[2] },
        { sel: '#promptList', text: translations[state.language].tourSteps[3] },
        { sel: '#helpBtn', text: translations[state.language].tourSteps[4] },
      ];
      let current = 0;
      const overlay = qs('#tourOverlay');
      const spotlight = qs('#tourSpotlight');
      const tooltip = qs('#tourTooltip');
      const text = qs('#tourText');

      const positionStep = () => {
        const step = steps[current];
        const target = qs(step.sel);
        if (!target) return;
        const rect = target.getBoundingClientRect();
        const padding = 8;
        spotlight.style.width = rect.width + padding * 2 + 'px';
        spotlight.style.height = rect.height + padding * 2 + 'px';
        spotlight.style.top = rect.top - padding + 'px';
        spotlight.style.left = rect.left - padding + 'px';
        text.textContent = step.text;
        tooltip.style.top = Math.min(rect.bottom + 12, window.innerHeight - tooltip.offsetHeight - 12) + 'px';
        let left = rect.left;
        if (left + tooltip.offsetWidth > window.innerWidth) {
          left = window.innerWidth - tooltip.offsetWidth - 12;
        }
        tooltip.style.left = Math.max(12, left) + 'px';
      };

      qs('#tourPrev').onclick = () => { current = Math.max(0, current - 1); positionStep(); };
      qs('#tourNext').onclick = () => { current = Math.min(steps.length - 1, current + 1); positionStep(); };
      qs('#tourEnd').onclick = () => overlay.classList.remove('active');
      overlay.classList.add('active');
      setTimeout(positionStep, 50);
      window.addEventListener('resize', positionStep, { once: false });
    }

    function setupEvents() {
      qs('#promptForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const tags = parseTagsInput(qs('#tagsInput').value);
        const prompt = {
          id: state.editing || uuid(),
          title: qs('#title').value.trim(),
          text: qs('#text').value.trim(),
          notes: qs('#notes').value.trim(),
          date: qs('#date').value,
          copies: Number(qs('#copies').value || 0),
          favorite: qs('#favorite').checked,
          tags
        };
        if (state.editing) {
          const idx = state.prompts.findIndex(p => p.id === state.editing);
          state.prompts[idx] = prompt;
        } else {
          state.prompts.unshift(prompt);
        }
        saveState();
        renderTags();
        renderPrompts(qs('#search').value);
        resetForm();
        if (window.matchMedia('(max-width: 900px)').matches) toggleFormModal(false);
      });

      qs('#resetBtn').addEventListener('click', resetForm);
      qs('#tagsInput').addEventListener('blur', (e) => {
        const tags = parseTagsInput(e.target.value);
        qs('#tagsInput').value = tags.join(', ');
        setSelectedTags(tags);
        renderTags();
      });
      qs('#langSelect').addEventListener('change', (e) => applyLanguage(e.target.value));
      qs('#tourBtn').addEventListener('click', startTour);
      qs('#helpBtn').addEventListener('click', () => qs('#help-modal').classList.remove('hidden'));
      qs('#closeHelp').addEventListener('click', () => qs('#help-modal').classList.add('hidden'));
      qs('#exportBtn').addEventListener('click', exportXML);
      qs('#importInput').addEventListener('change', (e) => { const file = e.target.files[0]; if (file) importXML(file); e.target.value = ''; });
      qs('#search').addEventListener('input', (e) => renderPrompts(e.target.value));
      qs('#fab').addEventListener('click', () => toggleFormModal(true));
      qs('#toggleTags').addEventListener('click', () => {
        const list = qs('#tagList');
        list.classList.toggle('expanded');
      });
      qs('#tourOverlay').addEventListener('click', (e) => { if (e.target.id === 'tourOverlay') e.target.classList.remove('active'); });
    }

    function initTagCollapse() {
      if (window.matchMedia('(max-width: 900px)').matches) {
        qs('#tagList').classList.remove('expanded');
      } else {
        qs('#tagList').classList.add('expanded');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initThemes();
      loadState();
      initTagCollapse();
      qs('#langSelect').value = state.language;
      renderTags();
      renderPrompts();
      setupEvents();
      qs('#date').value = new Date().toISOString().split('T')[0];
    });
  </script>
</body>
</html>
